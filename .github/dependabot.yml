version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "semver:patch"]
  - package-ecosystem: pip
    directory: /toolkit
    schedule:
      interval: weekly
    labels: [dependencies, "semver:patch"]
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    labels: [dependencies, "semver:patch"]
