version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "semver:patch"]
    # Internal payload P must follow the two-commit protocol in MAINTAINERS.md.
    ignore:
      - dependency-name: "mthalman/release-automation"
      - dependency-name: "mthalman/release-automation/*"
  - package-ecosystem: pip
    directory: /toolkit
    schedule:
      interval: weekly
    labels: [dependencies, "semver:patch"]
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    labels: [dependencies, "semver:patch"]
