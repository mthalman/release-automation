name: Finalize a tagged release
description: Recheck a prepared context and publish only that GitHub release after successful consumer steps
inputs:
  token:
    description: GitHub token with contents write and any additional authorization required to publish
    required: false
    default: ${{ github.token }}
  context:
    description: Unmodified context output from prepare-release in the same tag push workflow
    required: true
outputs:
  release-id:
    description: Validated GitHub release ID
    value: ${{ steps.finalize.outputs.release-id }}
  release-url:
    description: GitHub release URL
    value: ${{ steps.finalize.outputs.release-url }}
  already-published:
    description: True if publication was already complete and no mutation was made
    value: ${{ steps.finalize.outputs.already-published }}
runs:
  using: composite
  steps:
    - name: Set up toolkit Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Recheck and publish the prepared release
      id: finalize
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_HOST: github.com
        RELEASE_CONTEXT: ${{ inputs.context }}
        ACTION_PATH: ${{ github.action_path }}
      run: python -I "$ACTION_PATH/../../toolkit/action_runtime.py" finalize
